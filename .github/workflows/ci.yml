name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - run: uv run twine check dist/*
      - name: Smoke-test installed wheel
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_test.py
      - name: Smoke-test installed source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: distributions
          path: dist/
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run pip-audit
